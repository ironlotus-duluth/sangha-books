<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results — Iron Lotus Sangha</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="header"></div>
  <div class="page-wrap">
    <h1 id="pageTitle">Current Standings</h1>
    <p class="subtitle">
      Results are calculated using ranked voting.
      <a href="vote.html" style="font-size:0.95rem;">Learn how it works &rarr;</a>
    </p>

    <div id="msg" class="msg msg-error hidden"></div>
    <div id="results"></div>

    <div id="voterList" class="hidden" style="margin-top:2rem;">
      <h2>Who has voted</h2>
      <p id="voterNames" style="color:#555;"></p>
    </div>

    <div style="margin-top:2rem; text-align:center;">
      <button class="btn btn-outline btn-small" id="refreshBtn">Refresh results</button>
    </div>

    <div class="site-footer">Iron Lotus Sangha · Duluth</div>
  </div>

  <script src="app.js"></script>
  <script>
    if (!requireAuth()) throw 'redirect';
    renderHeader(document.getElementById('header'));
    document.getElementById('pageTitle').textContent = `Results — ${Session.getRound()}`;

    loadResults();

    document.getElementById('refreshBtn').addEventListener('click', loadResults);

    function showVoters(votes) {
      const names = votes.map(v => v.voter).filter(Boolean);
      if (names.length) {
        document.getElementById('voterNames').textContent = names.join(', ');
        document.getElementById('voterList').classList.remove('hidden');
      }
    }

    async function loadResults() {
      showLoading('results', 'Loading results...');
      document.getElementById('voterList').classList.add('hidden');

      try {
        const [roundData, votes] = await Promise.all([
          API.getRoundWithBooks(Session.getRound(), Session.getPassword()),
          API.getVotes()
        ]);

        const books = roundData.books || [];
        const votingOpen = roundData.round && roundData.round.votingOpen;

        if (roundData.error || votes.error) {
          showMsg('msg', roundData.error || votes.error);
          document.getElementById('results').innerHTML = '';
          return;
        }

        // Standings stay hidden while voting is open so they can't sway anyone's ballot
        if (votingOpen) {
          document.getElementById('pageTitle').textContent = `Voting — ${Session.getRound()}`;
          document.getElementById('results').innerHTML = `
            <div class="results-hero">
              <div class="results-hero-label">Voting is open</div>
              <div class="results-hero-title">${votes.length} member${votes.length !== 1 ? 's have' : ' has'} voted so far</div>
              <div class="results-hero-meta">
                Results are hidden while voting is open, so everyone can vote their true preferences.
                They'll appear here as soon as voting closes.
              </div>
            </div>
            <p style="text-align:center; margin-top:1rem;"><a href="vote.html">Haven't voted yet? Vote now &rarr;</a></p>`;
          showVoters(votes);
          return;
        }

        if (!votes.length) {
          document.getElementById('results').innerHTML =
            '<p class="msg msg-info">No votes have been cast yet. Check back once voting begins!</p>';
          return;
        }

        const candidates = books.map(b => b.title);
        const result = RCV.calculate(votes, candidates);
        RCV.renderResults(document.getElementById('results'), result, books, votingOpen);

        showVoters(votes);

      } catch (err) {
        showMsg('msg', 'Could not load results. Please refresh and try again.');
        document.getElementById('results').innerHTML = '';
      }
    }
  </script>
</body>
</html>
